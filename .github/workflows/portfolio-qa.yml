name: Portfolio build and desktop-mobile QA
on:
  push:
    branches: [main, fix/reference-motion-v2]
  pull_request:
permissions:
  contents: read
concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and report exact dependency versions
        run: npm install --no-fund && npm ls --depth=0
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build production app and type-check
        run: npm run build && npm run typecheck
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Browser interaction regression tests
        run: npm run test:e2e
      - name: Verify exact deployed release in real desktop and mobile browsers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: node scripts/live-smoke.mjs
      - name: Collect deployable source
        if: always()
        run: git archive --format=zip HEAD -o website-template2-rebuilt-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-evidence
          path: |
            playwright-report/
            test-results/
            live-evidence/
            package-lock.json
            website-template2-rebuilt-source.zip
          retention-days: 14
