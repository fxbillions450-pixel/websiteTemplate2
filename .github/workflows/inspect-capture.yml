name: Compare reference and rebuilt frames
on:
  push:
    branches: [audit/inspect-capture-20260928]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reference-interactions
          run-id: 36480789920
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reference
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-v2-browser-evidence
          run-id: 36483573185
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rebuilt
      - name: Print compact comparison frames and failure context
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image,ImageDraw
          import glob,base64,io,os
          print('REFERENCE_FILES',glob.glob('reference/*.png'))
          for f in glob.glob('rebuilt/test-results/**/error-context.md',recursive=True): print('FAILURE_CONTEXT',open(f).read())
          for label,patterns in [
           ('grid',['reference/desktop-scroll-6.png','reference/mobile-02-after-tap.png','rebuilt/test-results/screens/desktop-chromium-02-grid.png','rebuilt/test-results/screens/iphone-webkit-03-panned.png']),
           ('menu',['reference/desktop-04-menu.png','reference/mobile-04-menu.png','rebuilt/test-results/screens/desktop-chromium-04-menu.png','rebuilt/test-results/screens/iphone-webkit-04-menu.png'])]:
            sheet=Image.new('RGB',(460,430),'white');draw=ImageDraw.Draw(sheet)
            for i,p in enumerate(patterns):
              if not os.path.exists(p):continue
              image=Image.open(p).convert('RGB');image.thumbnail((290 if i%2==0 else 150,190));x=0 if i%2==0 else 300;y=(i//2)*215+20
              sheet.paste(image,(x,y));draw.text((x+2,y-16),('REF' if i<2 else 'NEW')+(' PC' if i%2==0 else ' MOBILE'),fill='black')
            out=io.BytesIO();sheet.save(out,'JPEG',quality=13,optimize=True);print('COMPARE_FRAME',label,base64.b64encode(out.getvalue()).decode())
          PY
