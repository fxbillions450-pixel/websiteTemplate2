name: Reference interaction capture
on:
  push:
    branches: [audit/reference-motion-20260928]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/browser-capture"
          cp scripts/capture-reference.mjs "$RUNNER_TEMP/browser-capture/"
          cd "$RUNNER_TEMP/browser-capture"
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium webkit
      - name: Capture real desktop and mobile interactions
        run: cd "$RUNNER_TEMP/browser-capture" && node capture-reference.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-interactions
          path: ${{ runner.temp }}/browser-capture/evidence
          retention-days: 1
